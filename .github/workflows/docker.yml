name: Immagine Docker

# Costruisce l'immagine e la pubblica su GitHub Container Registry (ghcr.io/helmutsti/filmshare).
# Sul server di casa: docker compose pull && docker compose up -d

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/helmutsti/filmshare:latest
            ghcr.io/helmutsti/filmshare:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
