# nginx davanti a FilmShare: dashboard, inoltro dell'API al server Node, download dei file dal NAS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Gli upload tus arrivano a pezzi da 64 MB (vedi web/src/uploads.ts): qui un margine.
    client_max_body_size 128m;

    sendfile on;
    tcp_nopush on;

    # Dashboard (applicazione a pagina singola)
    location / {
        try_files $uri /index.html;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js      { add_header Cache-Control "no-cache"; }
    location /assets/      { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # API, upload tus, aggiornamenti in tempo reale (SSE)
    location /api/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_request_buffering off;   # tus: i pezzi passano subito, senza essere salvati da nginx
        proxy_buffering off;           # SSE: i messaggi arrivano subito
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # File protetti: raggiungibili solo quando il server risponde con X-Accel-Redirect
    # (link firmato valido). nginx gestisce la ripresa (Range) e la velocità (X-Accel-Limit-Rate).
    location /_condivisi/ {
        internal;
        alias /data/condivisi/;
    }
}
